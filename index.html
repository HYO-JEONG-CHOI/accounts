<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="효정 가계부">
<meta name="format-detection" content="telephone=no">
<title>효정 가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar brand" id="brandBar">
    <svg class="brand-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M9 13.5 25.5 7.2a2.5 2.5 0 0 1 3.3 1.6l1.4 4.7" fill="var(--brand-soft-2)"/><rect x="4" y="12" width="32" height="23" rx="6" fill="var(--brand-soft)"/><path d="M36 19.5h-6.5a4 4 0 0 0 0 8H36z" fill="var(--brand-soft-2)"/><circle cx="30" cy="23.5" r="1.6" fill="#fff"/></svg>
    <h1>효정 가계부</h1>
    <button class="auth-btn" data-action="lock-toggle">
      <svg class="shield" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.3v6.1c0 4.6 3.2 8.6 7.5 10.1 4.3-1.5 7.5-5.5 7.5-10.1V5.3z" fill="currentColor"/><path d="m8.6 12 2.4 2.4 4.5-4.6" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="lockBtn">효정입니다.</span>
      <svg class="chev-r" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
    </button>
  </header>
  <header class="topbar" id="monthBar">
    <button class="icon-btn" data-action="prev-month" aria-label="이전 달">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="month-title" data-action="pick-month" id="monthTitle" aria-label="연도와 월 선택"></button>
    <button class="icon-btn" data-action="next-month" aria-label="다음 달">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="pill-btn" data-action="go-today" id="todayBtn">오늘</button>
  </header>
  <header class="topbar plain" id="plainBar" hidden><h1>설정</h1></header>

  <main id="main">
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-budget" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <button class="fab" id="fab" data-action="add-expense" aria-label="지출 추가">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="화면 이동">
    <button class="tab" data-tab="calendar" aria-label="캘린더">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>캘린더</span>
    </button>
    <button class="tab" data-tab="budget" aria-label="예산">
      <svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v1"/><rect x="4" y="8" width="16" height="11.5" rx="2.5"/><path d="M16 13.8h.01"/></svg><span>예산</span>
    </button>
    <button class="tab" data-tab="settings" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span>설정</span>
    </button>
  </nav>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
